[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ukrcode"
version = "0.1.0"
description = "Україномовна мова програмування з простим інтерпретатором"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "UkrCode contributors" }]

[project.scripts]
ucod = "ukrcode.cli:main"

[tool.setuptools.packages.find]
include = ["ukrcode*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]